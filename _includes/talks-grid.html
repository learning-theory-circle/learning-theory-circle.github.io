<h2>Upcoming Talks</h2>
<div id="upcoming-talks" class="talk-grid"></div>

<h2>Past Talks</h2>
<div id="past-talks" class="talk-grid"></div>

<div id="all-talks" style="display: none;">
  {%- assign sorted = site.data.talks | sort: "date" -%}
  {%- for talk in sorted -%}
    {%- include talk-card.html talk=talk -%}
  {%- endfor -%}
</div>

<script src="{{ '/assets/js/talks.js' | relative_url }}"></script>
