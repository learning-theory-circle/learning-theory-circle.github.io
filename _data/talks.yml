- date: 2026-08-30
  presenter: Shayan Shahrabi-Farahani
  presenter_url: https://shayanshahrabi.github.io/
  affiliation: Shahid Beheshti University
  title: "The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks"
  paper: https://arxiv.org/abs/1803.03635
  abstract: "Neural networks often contain millions of parameters. But do they really need all of them? This paper argues that, hidden inside a randomly initialized network, there may already exist a small winning ticket capable of reaching the same accuracy as the full model when trained in isolation. It's a simple idea with far-reaching implications for pruning, efficiency, and our understanding of why deep learning works."

- date: 2026-08-16
  presenter: M. Mahdi Mostafaei
  presenter_url: https://www.linkedin.com/in/m-mahdi-mostafaei/
  affiliation: Shahid Beheshti University
  title: "Why Does SGD Prefer Flat Minima? Through the Lens of Dynamical Systems"
  paper: https://openreview.net/pdf/3dbe452fac989218cf8b8218e3f23f77352e00ba.pdf
  authors: Hikaru Ibayashi, Masaaki Imaizumi
  poster: "assets/posters/mahdi-mostafaei-2026-aug-16.png"
  video: "https://youtu.be/Kp-tXx1AMBE?si=SE_cGPZDE8p6_C7W"
  abstract: "We show that stochastic gradient descent (SGD) escapes sharp minima exponentially fast, even before reaching stationarity. While SGD is the standard optimizer for non-convex tasks like neural networks, its ability to find generalizable solutions remains unclear. Escaping analysis which measures how quickly SGD leaves poorly generalizing sharp minima has been insightful but previously required stationarity. In this work, we prove exponential escape in the non-stationary regime using Large Deviation Theory. Specifically, we identify the quasipotential as a key tool for characterizing SGD dynamics throughout training."

- date: 2026-08-02
  presenter: Erfan Sobhaei
  presenter_url: https://www.linkedin.com/in/erfansobhaei/
  affiliation: Sharif University of Technology
  title: "A Modern Take on the Bias-Variance Tradeoff in Neural Networks"
  paper: https://arxiv.org/abs/1810.08591 
  authors: Brady Neal, Sarthak Mittal, Aristide Baratin, Vinayak Tantia, Matthew Scicluna, Simon Lacoste-Julien, Ioannis Mitliagkas
  poster: "assets/posters/erfan-sobhaei-2026-aug-2.png"
  slides: "assets/slides/erfan-sobhaei-2026-aug-2.pdf"
  video: "https://youtu.be/8z3oVPGt3eA"
  abstract: "The bias-variance tradeoff tells us that as model complexity increases, bias falls and variances increases, leading to a U-shaped test error curve. However, recent empirical results with over-parameterized neural networks are marked by a striking absence of the classic U-shaped test error curve: test error keeps decreasing in wider networks. This suggests that there might not be a bias-variance tradeoff in neural networks with respect to network width, unlike was originally claimed by, e.g., Geman et al. (1992). Motivated by the shaky evidence used to support this claim in neural networks, we measure bias and variance in the modern setting. We find that both bias and variance can decrease as the number of parameters grows. To better understand this, we introduce a new decomposition of the variance to disentangle the effects of optimization and data sampling. We also provide theoretical analysis in a simplified setting that is consistent with our empirical findings."

- date: 2026-07-26
  presenter: Erfan Mirzaei
  presenter_url: https://erfunmirzaei.github.io/
  affiliation: Italian Institute of Technology
  title: "PAC-Bayesian Mini-Course, Session 6"
  paper: https://arxiv.org/abs/2510.06028
  authors: Andreas Maurer, Erfan Mirzaei, Massimiliano Pontil
  poster: "assets/posters/erfan-mirzaei-pac-bayesian-mini-course.png"
  slides: "assets/slides/erfan-mirzaei-2026-jul-26.pdf"
  video: "https://youtu.be/ZG5iv-kHQx8"
  abstract: "Overparameterized neural networks can fit both meaningful data and random labels, often achieving essentially zero training error in both cases. This makes the final training error a poor predictor of generalization in the interpolation regime. In this talk, I will present a data-dependent view of this problem based on Gibbs posteriors and Langevin Monte Carlo algorithms using the PAC-Bayes framework. The key idea is to look not only at the final interpolating model but also at the entire temperature path: how quickly the expected training loss decreases as the inverse temperature increases. We show that, for the Gibbs posterior, the PAC-Bayes complexity term admits an exact integral representation as an area under this mean training-loss curve. This area separates true-label learning from random-label memorization and leads to quantitative bounds that track the observed test error in overparameterized neural networks."

